# Include inside the existing owner HTTPS server, before broad API deny rules.
# Preserve the existing Host forwarding, authentication and all other routes.
# The HUB requires owner session/Origin/CSRF on every mutation. Only the exact
# upload content route accepts binary data; other mutations remain JSON-only.
location = /api/v1/workspace/owner/backups {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:2087;
}

location = /api/v1/workspace/owner/backups/jobs {
    limit_except POST { deny all; }
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:2087;
}

location = /api/v1/workspace/owner/backups/settings {
    limit_except PUT { deny all; }
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:2087;
}

location ~ "^/api/v1/workspace/owner/backups/jobs/[a-f0-9]{32}$" {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:2087;
}

location ~ "^/api/v1/workspace/owner/backups/jobs/[a-f0-9]{32}/cancel$" {
    limit_except POST { deny all; }
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:2087;
}

location ~ "^/api/v1/workspace/owner/backups/archives/[a-f0-9]{32}/download$" {
    limit_except GET { deny all; }
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    # The worker checks the complete immutable ciphertext before sending
    # headers. A bounded one-hour first-byte budget supports large archives;
    # client disconnect still cancels the check through HUB's request context.
    proxy_read_timeout 3600s;
    send_timeout 60s;
    proxy_pass http://127.0.0.1:2087;
}

location = /api/v1/workspace/owner/backups/uploads {
    limit_except GET POST { deny all; }
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:2087;
}

location ~ "^/api/v1/workspace/owner/backups/uploads/[a-f0-9]{32}$" {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:2087;
}

location ~ "^/api/v1/workspace/owner/backups/uploads/[a-f0-9]{32}/(cancel|remove)$" {
    limit_except POST { deny all; }
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:2087;
}

location ~ "^/api/v1/workspace/owner/backups/uploads/[a-f0-9]{32}/content$" {
    limit_except PUT { deny all; }
    client_max_body_size 66g;
    client_body_timeout 60s;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_next_upstream off;
    proxy_send_timeout 60s;
    proxy_read_timeout 21600s;
    send_timeout 60s;
    proxy_pass http://127.0.0.1:2087;
}

location ~ "^/api/v1/workspace/owner/backups/uploads/[a-f0-9]{32}/download$" {
    limit_except GET { deny all; }
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 3600s;
    send_timeout 60s;
    proxy_pass http://127.0.0.1:2087;
}

# Owner-only management reassignment, with session, Origin and CSRF in HUB.
location ~ "^/api/v1/workspace/clients/ownership/(quote|commit)$" {
    limit_except POST { deny all; }
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:2087;
}

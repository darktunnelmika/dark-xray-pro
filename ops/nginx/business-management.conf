# Add inside the existing owner HTTPS server before broad regex locations.
# Preserve its inherited Host forwarding and existing API deny fallback.
# HUB enforces feature gates, browser sessions, tenant scope and CSRF.
location ~ "^/api/v1/workspace/representatives/[A-Za-z0-9][A-Za-z0-9_.-]{0,63}/seller-permission$" {
    limit_except GET POST { deny all; }
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:2087;
}

location ~ "^/api/v1/workspace/representatives/[A-Za-z0-9][A-Za-z0-9_.-]{0,63}/sellers$" {
    limit_except GET POST { deny all; }
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:2087;
}


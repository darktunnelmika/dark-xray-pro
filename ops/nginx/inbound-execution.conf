# Managed inbound browser routes only. Include in the owner HTTPS server
# before broad regex locations. This is an additive delta: existing legacy
# route denials and the separate TLS Agent listener must remain unchanged.
# HUB still enforces owner/representative scope, browser session and CSRF.
location ~ "^/api/v1/workspace/native-inbounds/[1-9][0-9]{0,15}/execution$" {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:2087;
}

location ~ "^/api/v1/workspace/native-inbounds/[1-9][0-9]{0,15}/execution/(preview|commands|clients|reconciliations|reconciliations/preview)$" {
    limit_except POST { deny all; }
    client_max_body_size 2m;
    proxy_pass http://127.0.0.1:2087;
}

location ~ "^/api/v1/workspace/native-inbounds/[1-9][0-9]{0,15}/execution/(operations|reconciliations)/[A-Za-z0-9][A-Za-z0-9_.:-]{15,127}$" {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:2087;
}

location ~ "^/api/v1/workspace/clients/[A-Za-z0-9][A-Za-z0-9_.-]{0,63}/inbound-subscription(/export)?$" {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:2087;
}

location ~ "^/api/v1/workspace/clients/[A-Za-z0-9][A-Za-z0-9_.-]{0,63}/inbound-subscription/(issue|reveal|rotate|revoke)$" {
    limit_except POST { deny all; }
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:2087;
}

# A subscription path is a credential, including when its suffix is malformed.
location ~ "^/api/v1/inbound-subscriptions/[A-Za-z0-9_-]{43}$" {
    if ($request_method != GET) { return 405; }
    access_log off;
    error_log /dev/null;
    proxy_cache off;
    proxy_buffering off;
    proxy_pass http://127.0.0.1:2087;
}

location /api/v1/inbound-subscriptions/ {
    access_log off;
    error_log /dev/null;
    return 403;
}

# Include inside the owner HTTPS server, before any broad regex locations.
# The enclosing server must preserve Host and retain a default /api/ deny rule.
# Authentication and CSRF are enforced by the HUB; no Agent/admin routes here.
location = /api/v1/workspace/inbound-security/capabilities {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:2087;
}

# Explicit owner actions only. The bounded finder can outlast the default
# proxy timeout; this exception grants no new path or runtime authority.
location ~ ^/api/v1/workspace/inbound-security/(keys/(x25519|mldsa65|ech)|certificates/(inspect|generate|remote)|reality/(scan|find))$ {
    limit_except POST { deny all; }
    client_max_body_size 256k;
    proxy_read_timeout 95s;
    proxy_pass http://127.0.0.1:2087;
}

location ~ ^/api/v1/workspace/nodes/[A-Za-z0-9_-]+/(name|dependencies)$ {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:2087;
}

location ~ ^/api/v1/workspace/nodes/[A-Za-z0-9_-]+/rename$ {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:2087;
}

# Nonactivating owner preflight history. Never allow admin/Agent or activation APIs.
location ~ ^/api/v1/workspace/nodes/[A-Za-z0-9_-]+/replacements$ {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:2087;
}

location ~ "^/api/v1/workspace/nodes/[A-Za-z0-9_-]+/replacements/[a-f0-9]{32}/cancel$" {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:2087;
}

# Saved-plan promotion never enables a channel or starts a process. Its exact
# Node scope is startup-only; owner session, CSRF and review hash stay in HUB.
location ~ "^/api/v1/workspace/native-inbound-plans/[1-9][0-9]{0,15}/promotion$" {
    limit_except GET POST { deny all; }
    proxy_pass http://127.0.0.1:2087;
}

location ~ "^/api/v1/workspace/native-inbound-plans/[1-9][0-9]{0,15}/promotion/preview$" {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:2087;
}

# First-Apply proof capability is separately enabled at HUB startup. Browser
# requests cannot select a verifier, enable a channel or extend a proof window.
location ~ "^/api/v1/workspace/native-inbound-plans/[1-9][0-9]{0,15}/initial-health$" {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:2087;
}

location ~ "^/api/v1/workspace/native-inbound-plans/[1-9][0-9]{0,15}/initial-health/(prepare|rounds|snapshot)$" {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:2087;
}

location ~ "^/api/v1/workspace/native-inbound-plans/[1-9][0-9]{0,15}/initial-health/rounds/[a-f0-9]{32}$" {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:2087;
}

# Approved metered LAB channels; startup allowlist and owner CSRF stay in HUB.
location = /api/v1/workspace/metered-route-transactions {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:2087;
}

location ~ ^/api/v1/workspace/native-nodes/[A-Za-z0-9_-]+/metered-route-transactions$ {
    limit_except GET POST { deny all; }
    proxy_pass http://127.0.0.1:2087;
}

location ~ "^/api/v1/workspace/native-nodes/[A-Za-z0-9_-]+/metered-route-transactions/[a-f0-9]{32}/abandon$" {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:2087;
}

location = /api/v1/workspace/metered-handovers {
    limit_except GET POST { deny all; }
    proxy_pass http://127.0.0.1:2087;
}

location ~ "^/api/v1/workspace/metered-handovers/[a-f0-9]{32}$" {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:2087;
}

location ~ "^/api/v1/workspace/metered-handovers/[a-f0-9]{32}/(commands|cancel|health|health-rounds|consumer-health-rounds|lab-subscription-snapshot)$" {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:2087;
}

# Explicit N19 manifest review and mutation; approvals are startup-only.
location ~ "^/api/v1/workspace/metered-handovers/[a-f0-9]{32}/consumer-manifest$" {
    limit_except GET POST { deny all; }
    proxy_pass http://127.0.0.1:2087;
}

# Explicit N18 LAB capability; owner/self-representative scope stays in HUB.
location ~ "^/api/v1/workspace/clients/[A-Za-z0-9][A-Za-z0-9_.-]{0,63}/subscription$" {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:2087;
}

location ~ "^/api/v1/workspace/clients/[A-Za-z0-9][A-Za-z0-9_.-]{0,63}/subscription/(issue|reveal|rotate|revoke)$" {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:2087;
}

# The path is a bearer credential. Never retain it in proxy access/error logs
# or caches. This allowlist does not enable the default-off HUB capability.
location ~ "^/api/v1/subscriptions/[A-Za-z0-9_-]{43}$" {
    if ($request_method != GET) { return 405; }
    access_log off;
    error_log /dev/null;
    proxy_cache off;
    proxy_buffering off;
    proxy_pass http://127.0.0.1:2087;
}

# Invalid suffixes can still contain a real bearer token; deny them without
# copying that capability into the enclosing server's default access log.
location /api/v1/subscriptions/ {
    access_log off;
    error_log /dev/null;
    return 403;
}

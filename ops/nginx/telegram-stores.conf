# Include inside the existing owner HTTPS server before the API deny fallback.
# Preserve inherited Host forwarding. HUB checks signed owner session, Origin,
# CSRF and current store binding before every credential operation.
location = /api/v1/workspace/telegram {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:2087;
}

location = /api/v1/workspace/telegram/stores {
    limit_except POST { deny all; }
    client_max_body_size 4k;
    proxy_next_upstream off;
    proxy_pass http://127.0.0.1:2087;
}

location = /api/v1/workspace/telegram/verify {
    limit_except POST { deny all; }
    client_max_body_size 1k;
    client_body_buffer_size 2k;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_next_upstream off;
    access_log off;
    proxy_pass http://127.0.0.1:2087;
}

location ~ "^/api/v1/workspace/telegram/stores/[A-Za-z0-9][A-Za-z0-9_.-]{0,63}/(connection|check)$" {
    limit_except POST { deny all; }
    client_max_body_size 1k;
    client_body_buffer_size 2k;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_next_upstream off;
    access_log off;
    proxy_pass http://127.0.0.1:2087;
}

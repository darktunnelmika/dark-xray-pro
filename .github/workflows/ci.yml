name: DARK XRAY PRO — Foundation CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  final-tcp-core:
    name: Experimental pinned core final TCP counters
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: XTLS/Xray-core
          ref: 52a412d9e2f5c2a5142b1b4e2ab3771dacb8b120
          path: .barrier-core
      - uses: actions/setup-go@v5
        with:
          go-version-file: .barrier-core/go.mod
          cache: false
      - name: Verify immutable upstream and apply the bounded TCP overlay
        run: python3 scripts/prepare-barrier-core.py .barrier-core
      - name: Prove late task completion and build the separate experimental core
        working-directory: .barrier-core
        run: |
          go mod verify
          go test -race ./common/darkpro ./common/task -run 'Test(Drain|InvalidNonce|ExecuteParallel)' -count=20 -timeout=120s
          go build -trimpath -o "$RUNNER_TEMP/xray-final-tcp" ./main
          chmod 0700 "$RUNNER_TEMP/xray-final-tcp"
          echo "DARK_PRO_TEST_XRAY_BINARY=$RUNNER_TEMP/xray-final-tcp" >> "$GITHUB_ENV"
          echo "DARK_PRO_TEST_XRAY_SHA256=$(sha256sum "$RUNNER_TEMP/xray-final-tcp" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Prove active Vision streams, exact final receipts and restart replay
        env:
          DARK_PRO_TEST_FINAL_TCP: '1'
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          go test -race ./internal/corebarrier -run '^TestRealPinnedCoreFinalTCPProtocol$' -count=3 -json -timeout=90s > "$RUNNER_TEMP/core-protocol.jsonl"
          go test -race ./internal/api -run '^TestRealPinned(ActiveTCPSettlement|MeteredTransactions)$' -count=3 -json -timeout=360s > "$RUNNER_TEMP/active-tcp-settlement.jsonl"
          python3 - "$RUNNER_TEMP/active-tcp-settlement.jsonl" "$RUNNER_TEMP/core-protocol.jsonl" <<'PYFINAL'
          import collections,json,sys
          events=[json.loads(line) for line in open(sys.argv[1])]
          name='TestRealPinnedActiveTCPSettlement'
          required={name}|{name+'/'+s for s in ('active-replacement','active-lost-final-receipt','active-lost-confirmation','active-unknown-tail','active-interrupted','active-no-opt-in')}
          passed=collections.Counter(e.get('Test') for e in events if e.get('Action')=='pass')
          assert all(passed[n]==3 for n in required),dict(passed)
          assert not any(e.get('Action') in ('skip','fail') and e.get('Test','').startswith(name) for e in events)
          name='TestRealPinnedMeteredTransactions'
          required={name}|{name+'/'+s for s in ('transaction-apply-rollback','transaction-lost-seal','transaction-revoked-after-seal','transaction-unknown-tail','transaction-register-failed','transaction-lost-ack-restart')}
          assert all(passed[n]==3 for n in required),dict(passed)
          assert not any(e.get('Action') in ('skip','fail') and e.get('Test','').startswith(name) for e in events)
          protocol=[json.loads(line) for line in open(sys.argv[2])]
          test='TestRealPinnedCoreFinalTCPProtocol'
          assert sum(e.get('Action')=='pass' and e.get('Test')==test for e in protocol)==3
          assert not any(e.get('Action') in ('skip','fail') for e in protocol)
          events+=protocol
          for e in events:
              if e.get('Output'): print(e['Output'],end='')
          PYFINAL
      - name: Active stream diagnostics
        if: failure()
        run: |
          if test -f "$RUNNER_TEMP/active-tcp-settlement.jsonl"; then cat "$RUNNER_TEMP/active-tcp-settlement.jsonl"; fi
          if test -f "$RUNNER_TEMP/core-protocol.jsonl"; then cat "$RUNNER_TEMP/core-protocol.jsonl"; fi
      - name: Prove independent metered HUB queue, TLS authority and exact receipts
        env:
          DARK_PRO_TEST_FINAL_TCP: '1'
        run: |
          go test -race ./internal/api -run '^TestRealPinnedMeteredRouteTransport$' -count=3 -json -timeout=240s > "$RUNNER_TEMP/metered-route-transport.jsonl" || { cat "$RUNNER_TEMP/metered-route-transport.jsonl"; exit 1; }
          python3 - "$RUNNER_TEMP/metered-route-transport.jsonl" <<'PYMETERED'
          import collections,json,sys
          events=[json.loads(line) for line in open(sys.argv[1])]
          name='TestRealPinnedMeteredRouteTransport'
          required={name}|{name+'/'+s for s in ('replace-rollback','lost-ack-before','lost-ack-after','revoked-after-final','lost-registration','lost-seal')}
          passed=collections.Counter(e.get('Test') for e in events if e.get('Action')=='pass')
          assert all(passed[n]==3 for n in required),dict(passed)
          assert not any(e.get('Action') in ('skip','fail') for e in events)
          for e in events:
              if e.get('Output'): print(e['Output'],end='')
          PYMETERED
      - name: Prove owner HUB commands with actual traffic in an isolated network
        run: |
          bash scripts/test-hub-active-traffic.sh || { cat "$RUNNER_TEMP/hub-active-traffic.jsonl" 2>/dev/null || true; exit 1; }
          python3 - "$RUNNER_TEMP/hub-active-traffic.jsonl" <<'PYHUBTRAFFIC'
          import collections,json,sys
          events=[json.loads(line) for line in open(sys.argv[1])]
          name='TestRealPinnedMeteredRouteActiveTraffic'
          required={name}|{name+'/'+s for s in ('replace-rollback','lost-ack-before','lost-ack-after','lost-final-receipt','lost-seal','revoked-after-final','unknown-tail','interrupted','drain','creation-plan-promotion')}
          passed=collections.Counter(e.get('Test') for e in events if e.get('Action')=='pass')
          assert all(passed[n]==3 for n in required),dict(passed)
          assert not any(e.get('Action') in ('skip','fail') for e in events)
          assert not any('WARNING: DATA RACE' in e.get('Output','') for e in events)
          assert sum('PLAN_PROMOTION_ACTIVE_PASS' in e.get('Output','') for e in events)==3
          for e in events:
              if e.get('Output'): print(e['Output'],end='')
          PYHUBTRAFFIC
      - name: Prove two Node handover with real traffic and lost receipts
        run: |
          bash scripts/test-hub-active-traffic.sh --handover || { cat "$RUNNER_TEMP/hub-active-handover.jsonl" 2>/dev/null || true; exit 1; }
          python3 - "$RUNNER_TEMP/hub-active-handover.jsonl" <<'PYHANDOVER'
          import collections,json,sys
          events=[json.loads(line) for line in open(sys.argv[1])]
          name='TestRealPinnedMeteredHandoverActiveTraffic'
          required={name}|{name+'/'+s for s in ('normal','lost-drain-ack-before','lost-drain-ack-after','lost-final-receipt')}
          passed=collections.Counter(e.get('Test') for e in events if e.get('Action')=='pass')
          assert all(passed[n]==3 for n in required),dict(passed)
          assert not any(e.get('Action') in ('skip','fail') for e in events)
          assert not any('WARNING: DATA RACE' in e.get('Output','') for e in events)
          for e in events:
              if e.get('Output'): print(e['Output'],end='')
          PYHANDOVER
      - name: Prove actual destination protocol health and concurrent emergency stop
        run: |
          bash scripts/test-hub-active-traffic.sh --handover-health || { cat "$RUNNER_TEMP/hub-handover-health.jsonl" 2>/dev/null || true; exit 1; }
          python3 - "$RUNNER_TEMP/hub-handover-health.jsonl" <<'PYHEALTH'
          import collections,json,sys
          events=[json.loads(line) for line in open(sys.argv[1])]
          name='TestRealPinnedMeteredHandoverProtocolHealth'
          required={name}|{name+'/'+s for s in ('verified-and-bound','reject-wrong-verifier','drain-during-probe','owner-agent-lost-replies','owner-agent-complete-round','owner-agent-consumer-manifest')}
          passed=collections.Counter(e.get('Test') for e in events if e.get('Action')=='pass')
          assert all(passed[n]==3 for n in required),dict(passed)
          assert sum('LAB_SUBSCRIPTION_REAL_PASS:' in e.get('Output','') for e in events)==3
          assert sum('CONSUMER_MANIFEST_REAL_PASS:' in e.get('Output','') for e in events)==3
          assert not any(e.get('Action') in ('skip','fail') for e in events)
          assert not any('WARNING: DATA RACE' in e.get('Output','') for e in events)
          for e in events:
              if e.get('Output'): print(e['Output'],end='')
          PYHEALTH
      - name: Prove promoted first Apply, protocol health and exact subscription traffic
        run: |
          bash scripts/test-hub-active-traffic.sh --initial-health || { cat "$RUNNER_TEMP/hub-initial-health.jsonl" 2>/dev/null || true; exit 1; }
          python3 - "$RUNNER_TEMP/hub-initial-health.jsonl" <<'PYINITIAL'
          import collections,json,sys
          events=[json.loads(line) for line in open(sys.argv[1])]
          name='TestRealPinnedInitialApplyProtocolHealth'
          required={name}|{name+'/'+s for s in ('verified-subscription','lost-receipt-before','lost-receipt-after','drain-during-probe','reject-wrong-verifier','expired-restart')}
          passed=collections.Counter(e.get('Test') for e in events if e.get('Action')=='pass')
          assert all(passed[n]==3 for n in required),dict(passed)
          assert sum('INITIAL_APPLY_SUBSCRIPTION_REAL_PASS:' in e.get('Output','') for e in events)==3
          assert not any(e.get('Action') in ('skip','fail') for e in events)
          assert not any('WARNING: DATA RACE' in e.get('Output','') for e in events)
          for e in events:
              if e.get('Output'): print(e['Output'],end='')
          PYINITIAL
      - name: Repeat unknown-tail accounting fence with isolated customer ports
        run: |
          bash scripts/test-hub-active-traffic.sh --unknown-tail-stress || { cat "$RUNNER_TEMP/hub-active-traffic-unknown-tail.jsonl" 2>/dev/null || true; exit 1; }
          python3 - "$RUNNER_TEMP/hub-active-traffic-unknown-tail.jsonl" <<'PYUNKNOWN'
          import collections,json,sys
          events=[json.loads(line) for line in open(sys.argv[1])]
          passed=collections.Counter(e.get('Test') for e in events if e.get('Action')=='pass')
          name='TestRealPinnedMeteredRouteActiveTraffic'
          assert passed[name]==20 and passed[name+'/unknown-tail']==20,dict(passed)
          assert not any(e.get('Action') in ('skip','fail') for e in events)
          assert not any('WARNING: DATA RACE' in e.get('Output','') for e in events)
          for e in events:
              if e.get('Output'): print(e['Output'],end='')
          PYUNKNOWN
      - name: Repeat interrupted active stream recovery with transport diagnostics
        env:
          DARK_PRO_TEST_FINAL_TCP: '1'
        run: go test -race ./internal/api -run '^TestRealPinnedActiveTCPSettlement/active-interrupted$' -count=20 -timeout=240s -v

  go:
    name: Go unit, race and vet
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify committed Go dependency checksums and module graph
        run: |
          test -s go.sum
          go mod verify
          go mod tidy -diff
      - name: Guard against dropped Go packages and unsafe legacy imports
        run: |
          for path in internal/routeplan/draft.go internal/replacement/journal.go internal/routecheck/tcp.go internal/noderegistry/registry.go internal/telemetry/store.go internal/agenttransport/client.go internal/xrayconfig/render.go internal/xrayconfig/validate.go internal/configstage/store.go internal/api/configstage.go cmd/node-agent/configstage.go internal/business/store.go internal/business/auth.go internal/business/groups.go internal/business/lifecycle.go internal/api/business.go internal/api/browser_auth.go internal/api/workspace.go internal/api/groups.go internal/api/client_lifecycle.go cmd/owner-setup/main.go internal/xraycanary/canary_linux.go internal/xraycanary/runtime_linux.go internal/managedxray/runtime_linux.go internal/managedxray/delivery_linux.go internal/business/inbounds.go internal/api/native_inbounds.go internal/xrayconfig/assigned.go internal/labrevision/journal.go internal/api/labrevisions.go; do
            test -s "$path" || { echo "MISSING expected Go module: $path"; exit 1; }
          done
          test ! -e backend/dark_policy.py || { echo "Legacy HUB files must not be imported into PRO"; exit 1; }
      - name: Go unit/race tests
        run: go test -race ./...
      - name: Repeat two-Node handover accounting barrier contracts
        run: go test -race ./internal/business ./internal/usageledger ./internal/api -run '^(TestMeteredHandover|TestReviewedBusinessSchemaVersions)' -count=10 -timeout=240s -v
      - name: Repeat protocol health identity, expiry, TLS and SOCKS boundaries
        run: go test -race ./internal/managedxray -run '^TestProtocolHealth' -count=10 -timeout=180s -v
      - name: Repeat isolated system probe accounting, replay and schema contracts
        run: go test -race ./internal/business ./internal/usageledger ./internal/usagecheckpoint -run '^TestSystemProbe' -count=10 -timeout=180s -v
      - name: Persisted HUB challenges and complete inbound health rounds
        run: go test -race ./internal/business ./internal/usageledger -run '^TestMeteredHealth' -count=10 -timeout=600s -v
      - name: Owner full-round boundaries and encrypted Agent replay
        run: go test -race ./internal/api ./internal/managedxray -run '^(TestMeteredHealth(Owner|Round)|TestProtocolHealth(Transport|Journal))' -count=10 -timeout=240s -v
      - name: First Apply proof, preparation, delivery authority and version boundaries
        run: go test -race ./internal/business ./internal/usageledger ./internal/api ./internal/managedxray -run '^TestInitialApply' -count=3 -timeout=360s -v
      - name: Repeat node name receipt and concurrency contracts
        run: go test -race ./internal/noderegistry ./internal/api -run 'TestRename|TestOwnerNodeRename' -count=5 -timeout=120s -v
      - name: Repeat read-only node dependency contracts
        run: go test -race ./internal/business ./internal/api -run 'TestNodeDependencies|TestOwnerNodeDependencies|TestNodeHistory|TestNodeRetained' -count=5 -timeout=120s -v
      - name: Repeat observer stop receipt race regression
        shell: bash
        run: |
          set -euo pipefail
          # These process-lifecycle fixtures must execute, never skip as root.
          test "$(id -u)" -ne 0
          go test -race ./internal/managedxray -count=20 -timeout=120s -v \
            -run '^TestUsageObserver(FailWaitsForOwnedProcessExit|IncompleteStatsStopsWithoutInventingZero)$'
      - name: Repeat durable route transaction failure cases under Race
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          go test -race ./internal/managedxray -run '^Test(RouteTransactions|MeteredTransaction)' -count=3 -timeout=120s -v
      - name: Repeat durable HUB queue and owner/Agent API boundaries under Race
        run: go test -race ./internal/business ./internal/api -run '^TestRouteQueue' -count=3 -timeout=120s -v
      - name: Repeat exact settlement and pretraffic recovery under Race
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          go test -race ./internal/usagecheckpoint ./internal/usageledger ./internal/managedxray ./internal/api ./cmd/node-agent \
            -run '^Test(UsageSettlement|AgentReplayGate)' -count=3 -timeout=120s -v
      - name: Go vet
        run: go vet ./...
      - name: Compile HUB and Node Agent
        run: |
          go build -o /tmp/dark-xray-pro-hub ./cmd/hub
          go build -o /tmp/dark-xray-pro-agent ./cmd/node-agent
          go build -o /tmp/dark-pro-owner-setup ./cmd/owner-setup
      - name: Verify no production defaults
        run: |
          if DARK_PRO_LAB_MODE=0 /tmp/dark-xray-pro-hub > /tmp/hub-refusal.log 2>&1; then
            echo "ERROR: refused-to-run safeguard failed"
            exit 1
          fi
          grep -q "not production-ready" /tmp/hub-refusal.log

  web:
    name: Web TypeScript and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Strict TypeScript and Vite build
        run: npm run build
      - name: Confirm real bundle output
        run: test -s dist/index.html && test -n "$(find dist/assets -type f -name '*.js' -print -quit)"

  # Intentionally no deploy jobs. A clean lab build is not a production release.

  browser:
    name: Real Chromium routes and theme QA
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install UI and browser runner
        run: npm install --no-audit --no-fund
      - name: Install Chromium dependencies
        run: npx playwright install --with-deps chromium
      - name: Run isolated route and responsive acceptance
        run: npm run test:browser
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Prove seller panel permissions and credit through real SQLite
        working-directory: ${{ github.workspace }}
        env:
          DARK_PRO_TEST_SELLER_BROWSER: "1"
          DARK_PRO_TEST_WEB_DIST: ${{ github.workspace }}/web/dist
          DARK_PRO_TEST_SELLER_BROWSER_SCRIPT: ${{ github.workspace }}/web/tests/live-seller-management.mjs
        run: go test -race ./internal/api -run '^TestRealBrowserSellerManagementV2$' -count=1 -v -timeout=180s
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dark-xray-pro-browser-failures
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore

  pinned-xray-core:
    name: Pinned real Xray core — LAB-only syntax and loopback smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Retrieve exact upstream Xray release and verify artifact digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dark-pro-isolated-xray"
          cd "$RUNNER_TEMP/dark-pro-isolated-xray"
          curl -fLSs --retry 3 --connect-timeout 10 --max-time 120 \
            "https://github.com/XTLS/Xray-core/releases/download/v26.9.9/Xray-linux-64.zip" \
            -o Xray-linux-64.zip
          printf '%s  %s\n' \
            '1eb9175d0f0a8f8149c9230a7fc5ae66ce332ed20a53155ce61fe62e3f58b7df' \
            'Xray-linux-64.zip' | sha256sum -c -
          unzip -j Xray-linux-64.zip xray -d "$RUNNER_TEMP/dark-pro-isolated-xray/bin"
          chmod 0700 "$RUNNER_TEMP/dark-pro-isolated-xray/bin/xray"
          printf 'DARK_PRO_TEST_XRAY_BINARY=%s\n' "$RUNNER_TEMP/dark-pro-isolated-xray/bin/xray" >> "$GITHUB_ENV"
          printf 'DARK_PRO_TEST_XRAY_SHA256=%s\n' \
            "$(sha256sum "$RUNNER_TEMP/dark-pro-isolated-xray/bin/xray" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Prove REALITY, TLS transports, trust rejection, network settings, Sniffing and Fallback with actual traffic
        env:
          DARK_PRO_LAB_MODE: "1"
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/xrayconfig -run '^TestRealPinnedXrayCoreOptIn$' -count=1 -json -timeout=90s > "$RUNNER_TEMP/profile-options.jsonl" || { cat "$RUNNER_TEMP/profile-options.jsonl"; exit 1; }
          python3 - "$RUNNER_TEMP/profile-options.jsonl" <<'PYOPTIONS'
          import json,sys
          events=[json.loads(line) for line in open(sys.argv[1])]
          name='TestRealPinnedXrayCoreOptIn'
          required={name,name+'/advanced-loopback',name+'/advanced-loopback/accepted-version',name+'/advanced-loopback/rejected-version'}
          traffic=name+'/inbound-options-loopback'
          required|={traffic,traffic+'/sniffing',traffic+'/fallbacks'}
          required|={traffic+'/sniffing/'+case for case in ('disabled','http-override','route-only','metadata-only','excluded-domain','excluded-original-ip','different-excluded-ip')}
          required|={traffic+'/fallbacks/'+case for case in ('http1-target','http2-target')}
          network=name+'/network-options-loopback'
          required|={network}
          required|={network+'/xhttp-'+mode for mode in ('auto','packet-up','stream-up','stream-one')}
          required|={network+'/xhttp-wrong-'+field for field in ('path','host','padding')}
          required|={network+'/grpc-'+mode for mode in ('gun','multi')}
          tls=name+'/tls-transports-loopback'
          required|={tls}
          required|={tls+'/tls-'+transport for transport in ('tcp','grpc','xhttp','ws','httpupgrade')}
          required|={tls+'/tls-xhttp-'+mode for mode in ('packet-up','stream-up','stream-one')}
          required|={tls+'/tls-grpc-gun'}
          required|={tls+'/tls-untrusted-'+transport for transport in ('tcp','grpc','xhttp','ws','httpupgrade')}
          required|={tls+'/tls-wrong-sni'}
          required|={tls+'/tls-'+transport+'-wrong-'+field for transport in ('xhttp','ws','httpupgrade') for field in ('path','host')}
          passed={e.get('Test') for e in events if e.get('Action')=='pass'}
          assert required<=passed, required-passed
          assert not any(e.get('Action') in ('skip','fail') for e in events)
          assert sum('ADVANCED_REALITY_TRAFFIC_PASS:' in e.get('Output','') for e in events)==1
          assert sum('ADVANCED_REALITY_VERSION_REJECT_PASS' in e.get('Output','') for e in events)==1
          assert sum('SNIFFING_TRAFFIC_PASS' in e.get('Output','') for e in events)==1
          assert sum('FALLBACK_TRAFFIC_PASS' in e.get('Output','') for e in events)==1
          assert sum('REALITY_FALLBACK_ALPN_UNSUPPORTED_PASS' in e.get('Output','') for e in events)==1
          assert sum('XHTTP_REALITY_TRAFFIC_PASS:' in e.get('Output','') for e in events)==1
          assert sum('XHTTP_REALITY_MISMATCH_REJECT_PASS:' in e.get('Output','') for e in events)==1
          assert sum('GRPC_CLIENT_OPTIONS_TRAFFIC_PASS:' in e.get('Output','') for e in events)==1
          assert sum('TLS_TRANSPORT_TRAFFIC_PASS:' in e.get('Output','') for e in events)==1
          assert sum('TLS_TRUST_REJECT_PASS:' in e.get('Output','') for e in events)==1
          assert sum('TLS_HTTP_MISMATCH_REJECT_PASS:' in e.get('Output','') for e in events)==1
          for e in events:
              if e.get('Output'): print(e['Output'],end='')
          PYOPTIONS
      - name: Run and stop real Xray on ephemeral loopback listeners only
        env:
          DARK_PRO_LAB_MODE: "1"
          DARK_PRO_ENABLE_LOOPBACK_CANARY: "1"
        run: go test ./internal/xraycanary -run '^TestRealPinnedXrayCanaryOptIn$' -v -count=1
      - name: Rehearse real Xray process apply and rollback on localhost only
        env:
          DARK_PRO_LAB_MODE: "1"
          DARK_PRO_ENABLE_SANDBOX_APPLY: "1"
        run: go test ./internal/xraycanary -run '^TestRealPinnedXraySandboxApplyRollbackOptIn$' -v -count=1
      - name: Prove durable Xray same-port rollback and actual REALITY traffic
        env:
          DARK_PRO_LAB_MODE: "1"
        run: go test ./internal/managedxray -run '^TestRealPinned' -v -count=1
      - name: Prove HUB queue and pinned Agent lost-ACK recovery on real Xray
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          go test -race ./internal/api -run '^TestRealPinnedRouteQueueAgentLostACKAndRollback$' -count=1 -json -timeout=120s > "$RUNNER_TEMP/route-queue.jsonl" || { cat "$RUNNER_TEMP/route-queue.jsonl"; exit 1; }
          python3 - "$RUNNER_TEMP/route-queue.jsonl" <<'PYQUEUE'
          import json,sys
          events=[json.loads(line) for line in open(sys.argv[1])]
          name='TestRealPinnedRouteQueueAgentLostACKAndRollback'
          assert sum(e.get('Test')==name and e.get('Action')=='pass' for e in events)==1
          assert not any(e.get('Test')==name and e.get('Action') in ('skip','fail') for e in events)
          for e in events:
              if e.get('Output'): print(e['Output'],end='')
          PYQUEUE
      - name: Prove staged transactions with real REALITY traffic and rollback under Race
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          go test -race ./internal/managedxray -run '^TestRealPinnedRouteTransactionsRealityRollback$' -count=1 -json -timeout=90s > "$RUNNER_TEMP/route-transactions.jsonl"
          python3 - "$RUNNER_TEMP/route-transactions.jsonl" <<'PYROUTE'
          import json,sys
          events=[json.loads(line) for line in open(sys.argv[1])]
          name='TestRealPinnedRouteTransactionsRealityRollback'
          assert sum(e.get('Action')=='pass' and e.get('Test')==name for e in events)==1
          assert not any(e.get('Action') in ('skip','fail') and e.get('Test','').startswith(name) for e in events)
          for event in events:
              if event.get('Output'): print(event['Output'],end='')
          PYROUTE
      - name: Prove native owner to pinned TLS Agent and real Xray revocation
        env:
          DARK_PRO_LAB_MODE: "1"
        run: go test ./internal/api -run '^TestRealPinnedNativeOwnerToAgentRuntime$' -v -count=1
      - name: Keep Xray and user credentials out of all persisted artifacts
        shell: bash
        run: |
          # No generated configs or Xray executable are uploaded to Actions artifacts.
          test ! -e lab-state

  isolated-lab-bundle:
    name: Linux amd64 LAB bundle (no deployment)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify owner Node Manager HTTPS allowlist with real nginx
        run: |
          if ! test -x /usr/sbin/nginx; then
            sudo apt-get update -qq
            sudo apt-get install -y nginx
          fi
          python3 scripts/test-node-manager-proxy.py
      - name: Validate installer shell syntax and strict safety guards
        run: |
          bash -n scripts/install-lab.sh
          bash -n internal/nodebootstrap/install-new-pro-node.sh
          bash -n scripts/build-lab-bundle.sh
          grep -q 'DARK_PRO_EXPECT_PUBLIC_IP' scripts/install-lab.sh
          grep -q 'ip -4 -o addr show scope global' scripts/install-lab.sh
          grep -q 'ip -4 route get 1.1.1.1' scripts/install-lab.sh
          grep -q '127.0.0.1:2087' scripts/install-lab.sh
          grep -q 'I_CONFIRM_NEW_EMPTY_SERVER' scripts/install-lab.sh
          grep -Fq 'webui.Embedded()' cmd/hub/main.go
          grep -Fq '//go:embed dist' internal/webui/webui.go
          grep -Fq 'for attempt in $(seq 1 30)' scripts/install-lab.sh
          grep -Fq 'embedded LAB UI failed its HTTP check' scripts/install-lab.sh
      - name: Build isolated static Go executables and compiled UI
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          DARK_PRO_PINNED_COMMIT="$GITHUB_SHA" bash scripts/build-lab-bundle.sh
          test ! -e release/web
          DARK_PRO_REQUIRE_EMBEDDED_UI=1 go test ./internal/webui -run '^TestReleaseContainsCompiledUI$' -count=1 -v
          test -z "$(find release -type d \( -name node_modules -o -name .git -o -name test-results \) -print -quit)"
          test -s release/bin/dark-pro-hub
          test -s release/bin/dark-pro-agent
          test -s release/bin/dark-pro-owner-setup
      - name: Create verifiable LAB-only archive
        shell: bash
        run: |
          set -euo pipefail
          cd release
          find bin scripts -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
          cd ..
          tar -czf dark-xray-pro-lab-linux-amd64.tar.gz -C release .
          sha256sum dark-xray-pro-lab-linux-amd64.tar.gz > dark-xray-pro-lab-linux-amd64.tar.gz.sha256
          test -s dark-xray-pro-lab-linux-amd64.tar.gz.sha256
      - name: Upload bundled non-production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dark-xray-pro-lab-linux-amd64
          path: |
            dark-xray-pro-lab-linux-amd64.tar.gz
            dark-xray-pro-lab-linux-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  inbound-authoring-core:
    name: Inbound authoring and security pinned core
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: XTLS/Xray-core
          ref: 701af60772cda123492f86e383e1fdba066614a9
          path: .authoring-core
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: false
      - name: Build the separate immutable authoring core
        working-directory: .authoring-core
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 701af60772cda123492f86e383e1fdba066614a9
          go mod download
          go mod verify
          go build -buildvcs=false -trimpath -o "$RUNNER_TEMP/xray-authoring" ./main
          chmod 0755 "$RUNNER_TEMP/xray-authoring"
          echo "DARK_PRO_TEST_XRAY_BINARY=$RUNNER_TEMP/xray-authoring" >> "$GITHUB_ENV"
          echo "DXP_INBOUNDSPEC_XRAY=$RUNNER_TEMP/xray-authoring" >> "$GITHUB_ENV"
          echo "DARK_PRO_TEST_XRAY_SHA256=$(sha256sum "$RUNNER_TEMP/xray-authoring" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "DXP_INBOUNDSPEC_XRAY_SHA256=$(sha256sum "$RUNNER_TEMP/xray-authoring" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Verify protocol and transport configs plus real security key commands
        run: |
          set -euo pipefail
          go test ./internal/inboundspec ./internal/inboundsecurity -run '^Test(PinnedCoreAcceptsNativeMatrix|PinnedXraySecurityKeyCommands)$' -count=1 -json -timeout=120s > "$RUNNER_TEMP/inbound-authoring-core.jsonl" || { cat "$RUNNER_TEMP/inbound-authoring-core.jsonl"; exit 1; }
          python3 - "$RUNNER_TEMP/inbound-authoring-core.jsonl" <<'PY'
          import json, sys
          rows=[json.loads(line) for line in open(sys.argv[1]) if line.strip()]
          for name in ('TestPinnedCoreAcceptsNativeMatrix','TestPinnedXraySecurityKeyCommands'):
              assert any(row.get('Test')==name and row.get('Action')=='pass' for row in rows), name
          PY
          cd "$RUNNER_TEMP"
          sha256sum xray-authoring > xray-authoring.sha256
          printf '%s\n' '701af60772cda123492f86e383e1fdba066614a9' > xray-authoring.source
      - name: Upload independently verified authoring helper
        uses: actions/upload-artifact@v4
        with:
          name: inbound-authoring-core-linux-amd64
          path: |
            ${{ runner.temp }}/xray-authoring
            ${{ runner.temp }}/xray-authoring.sha256
            ${{ runner.temp }}/xray-authoring.source
            ${{ runner.temp }}/inbound-authoring-core.jsonl
          if-no-files-found: error
          retention-days: 7

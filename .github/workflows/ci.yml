name: DARK XRAY PRO — Foundation CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  go:
    name: Go unit, race and vet
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify committed Go dependency checksums and module graph
        run: |
          test -s go.sum
          go mod verify
          go mod tidy -diff
      - name: Guard against dropped Go packages and unsafe legacy imports
        run: |
          for path in internal/routeplan/draft.go internal/replacement/journal.go internal/routecheck/tcp.go internal/noderegistry/registry.go internal/telemetry/store.go internal/agenttransport/client.go internal/xrayconfig/render.go internal/xrayconfig/validate.go internal/configstage/store.go internal/api/configstage.go cmd/node-agent/configstage.go internal/business/store.go internal/business/auth.go internal/business/groups.go internal/business/lifecycle.go internal/api/business.go internal/api/browser_auth.go internal/api/workspace.go internal/api/groups.go internal/api/client_lifecycle.go cmd/owner-setup/main.go internal/xraycanary/canary_linux.go internal/xraycanary/runtime_linux.go internal/managedxray/runtime_linux.go internal/managedxray/delivery_linux.go internal/business/inbounds.go internal/api/native_inbounds.go internal/xrayconfig/assigned.go internal/labrevision/journal.go internal/api/labrevisions.go; do
            test -s "$path" || { echo "MISSING expected Go module: $path"; exit 1; }
          done
          test ! -e backend/dark_policy.py || { echo "Legacy HUB files must not be imported into PRO"; exit 1; }
      - name: Go unit/race tests
        run: go test -race ./...
      - name: Go vet
        run: go vet ./...
      - name: Compile HUB and Node Agent
        run: |
          go build -o /tmp/dark-xray-pro-hub ./cmd/hub
          go build -o /tmp/dark-xray-pro-agent ./cmd/node-agent
          go build -o /tmp/dark-pro-owner-setup ./cmd/owner-setup
      - name: Verify no production defaults
        run: |
          if DARK_PRO_LAB_MODE=0 /tmp/dark-xray-pro-hub > /tmp/hub-refusal.log 2>&1; then
            echo "ERROR: refused-to-run safeguard failed"
            exit 1
          fi
          grep -q "not production-ready" /tmp/hub-refusal.log

  web:
    name: Web TypeScript and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Strict TypeScript and Vite build
        run: npm run build
      - name: Confirm real bundle output
        run: test -s dist/index.html && test -n "$(find dist/assets -type f -name '*.js' -print -quit)"

  # Intentionally no deploy jobs. A clean lab build is not a production release.

  browser:
    name: Real Chromium routes and theme QA
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install UI and browser runner
        run: npm install --no-audit --no-fund
      - name: Install Chromium dependencies
        run: npx playwright install --with-deps chromium
      - name: Run isolated route and responsive acceptance
        run: npm run test:browser
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dark-xray-pro-browser-failures
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore

  pinned-xray-core:
    name: Pinned real Xray core — LAB-only syntax and loopback smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Retrieve exact upstream Xray release and verify artifact digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dark-pro-isolated-xray"
          cd "$RUNNER_TEMP/dark-pro-isolated-xray"
          curl -fLSs --retry 3 --connect-timeout 10 --max-time 120 \
            "https://github.com/XTLS/Xray-core/releases/download/v26.9.9/Xray-linux-64.zip" \
            -o Xray-linux-64.zip
          printf '%s  %s\n' \
            '1eb9175d0f0a8f8149c9230a7fc5ae66ce332ed20a53155ce61fe62e3f58b7df' \
            'Xray-linux-64.zip' | sha256sum -c -
          unzip -j Xray-linux-64.zip xray -d "$RUNNER_TEMP/dark-pro-isolated-xray/bin"
          chmod 0700 "$RUNNER_TEMP/dark-pro-isolated-xray/bin/xray"
          printf 'DARK_PRO_TEST_XRAY_BINARY=%s\n' "$RUNNER_TEMP/dark-pro-isolated-xray/bin/xray" >> "$GITHUB_ENV"
          printf 'DARK_PRO_TEST_XRAY_SHA256=%s\n' \
            "$(sha256sum "$RUNNER_TEMP/dark-pro-isolated-xray/bin/xray" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Run actual pinned Xray syntax test with disposable users
        env:
          DARK_PRO_LAB_MODE: "1"
        run: go test ./internal/xrayconfig -run '^TestRealPinnedXrayCoreOptIn$' -v -count=1
      - name: Run and stop real Xray on ephemeral loopback listeners only
        env:
          DARK_PRO_LAB_MODE: "1"
          DARK_PRO_ENABLE_LOOPBACK_CANARY: "1"
        run: go test ./internal/xraycanary -run '^TestRealPinnedXrayCanaryOptIn$' -v -count=1
      - name: Rehearse real Xray process apply and rollback on localhost only
        env:
          DARK_PRO_LAB_MODE: "1"
          DARK_PRO_ENABLE_SANDBOX_APPLY: "1"
        run: go test ./internal/xraycanary -run '^TestRealPinnedXraySandboxApplyRollbackOptIn$' -v -count=1
      - name: Prove durable Xray same-port rollback and actual REALITY traffic
        env:
          DARK_PRO_LAB_MODE: "1"
        run: go test ./internal/managedxray -run '^TestRealPinned' -v -count=1
      - name: Prove native owner to pinned TLS Agent and real Xray revocation
        env:
          DARK_PRO_LAB_MODE: "1"
        run: go test ./internal/api -run '^TestRealPinnedNativeOwnerToAgentRuntime$' -v -count=1
      - name: Keep Xray and user credentials out of all persisted artifacts
        shell: bash
        run: |
          # No generated configs or Xray executable are uploaded to Actions artifacts.
          test ! -e lab-state

  isolated-lab-bundle:
    name: Linux amd64 LAB bundle (no deployment)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate installer shell syntax and strict safety guards
        run: |
          bash -n scripts/install-lab.sh
          bash -n scripts/build-lab-bundle.sh
          grep -q 'DARK_PRO_EXPECT_PUBLIC_IP' scripts/install-lab.sh
          grep -q 'ip -4 -o addr show scope global' scripts/install-lab.sh
          grep -q 'ip -4 route get 1.1.1.1' scripts/install-lab.sh
          grep -q '127.0.0.1:2087' scripts/install-lab.sh
          grep -q 'I_CONFIRM_NEW_EMPTY_SERVER' scripts/install-lab.sh
          grep -Fq 'find "$APP/web" -type d -exec chmod 0755' scripts/install-lab.sh
          grep -Fq 'find "$APP/web" -type f -exec chmod 0644' scripts/install-lab.sh
          grep -Fq 'for attempt in $(seq 1 30)' scripts/install-lab.sh
          grep -Fq 'runuser -u darkprolab -- test -r' scripts/install-lab.sh
      - name: Build isolated static Go executables and compiled UI
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          DARK_PRO_PINNED_COMMIT="$GITHUB_SHA" bash scripts/build-lab-bundle.sh
          test -s release/web/index.html
          test -s release/bin/dark-pro-hub
          test -s release/bin/dark-pro-agent
          test -s release/bin/dark-pro-owner-setup
      - name: Create verifiable LAB-only archive
        shell: bash
        run: |
          set -euo pipefail
          cd release
          find bin web scripts -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
          cd ..
          tar -czf dark-xray-pro-lab-linux-amd64.tar.gz -C release .
          sha256sum dark-xray-pro-lab-linux-amd64.tar.gz > dark-xray-pro-lab-linux-amd64.tar.gz.sha256
          test -s dark-xray-pro-lab-linux-amd64.tar.gz.sha256
      - name: Upload bundled non-production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dark-xray-pro-lab-linux-amd64
          path: |
            dark-xray-pro-lab-linux-amd64.tar.gz
            dark-xray-pro-lab-linux-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

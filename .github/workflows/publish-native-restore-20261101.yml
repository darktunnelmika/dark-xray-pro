name: Publish reviewed restore source only — 20261101

on:
  push:
    branches: [publish/native-panel-restore-20261101]
  pull_request:
    branches: [main]
    paths: [.github/workflows/publish-native-restore-20261101.yml]

permissions:
  contents: read

jobs:
  publish-code-only:
    if: github.repository == 'darktunnelmika/dark-xray-pro' && (github.ref == 'refs/heads/publish/native-panel-restore-20261101' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'publish/native-panel-restore-20261101'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 59e69e22119bd7e18e098a72e2799e12e893f37c
          fetch-depth: 0
      - name: Fetch only the code bundle over pinned TLS and verify exact identities
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/code-transfer-ca.pem" <<'CERT'

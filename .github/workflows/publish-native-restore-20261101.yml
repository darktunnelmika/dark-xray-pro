            --output "$RUNNER_TEMP/reviewed-source.bundle"
          test "$(stat -c %s "$RUNNER_TEMP/reviewed-source.bundle")" = 47387
          echo "125cd343c9a1441f6772d86dc10cfce79ba036a70e3d6304128efee211fbfa82  $RUNNER_TEMP/reviewed-source.bundle" | sha256sum --check --strict
          git bundle verify "$RUNNER_TEMP/reviewed-source.bundle"
          git -c core.hooksPath=/dev/null fetch --no-tags "$RUNNER_TEMP/reviewed-source.bundle" refs/heads/feat/native-panel-restore-v1:refs/remotes/review/restore
          target=23a765e085744f3311b977c20a0f0e64a243898c
          test "$(git rev-parse refs/remotes/review/restore)" = "$target"
          test "$(git rev-parse "$target^{tree}")" = add6afa051a675963a97965b8c60b53e98eea4af
          git merge-base --is-ancestor 59e69e22119bd7e18e098a72e2799e12e893f37c "$target"
          test "$(git rev-list --count 59e69e22119bd7e18e098a72e2799e12e893f37c.."$target")" = 2
          git diff --check 59e69e22119bd7e18e098a72e2799e12e893f37c "$target"
          existing=$(git ls-remote --heads origin refs/heads/feat/native-panel-restore-v1 | cut -f1)
          if [ -n "$existing" ]; then
            test "$existing" = "$target"
            echo 'Exact reviewed branch already published; no mutation.'
          else
            git -c core.hooksPath=/dev/null push origin "$target:refs/heads/feat/native-panel-restore-v1"
          fi
          test "$(git ls-remote --heads origin refs/heads/feat/native-panel-restore-v1 | cut -f1)" = "$target"
          echo 'Exact source published. No merge, deployment, server command, or financial data operation.'

jobs:
  publish-code-only:
    if: github.repository == 'darktunnelmika/dark-xray-pro' && github.ref == 'refs/heads/publish/native-panel-restore-20261101'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 59e69e22119bd7e18e098a72e2799e12e893f37c
          fetch-depth: 0
      - name: Fetch pinned code; keep all workflow files unchanged
        shell: bash
        run: |
          set -euo pipefail

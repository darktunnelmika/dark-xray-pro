          CERT
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --cacert "$RUNNER_TEMP/code-transfer-ca.pem" --connect-timeout 10 --max-time 60 \
            --max-filesize 47387 \
            'https://80.253.255.181:28444/code-only/fa7abac82ce122e961272cf838755211dc146a385519f07a.bundle' \

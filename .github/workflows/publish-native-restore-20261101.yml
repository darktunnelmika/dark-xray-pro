          # code here. The authorized connector adds the separate CI workflow.
          export GIT_INDEX_FILE="$RUNNER_TEMP/code-only-index"
          git read-tree 'refs/remotes/review/restore^{tree}'
          git update-index --cacheinfo 100644,0217c133f33fb6071c2ffd20430595e3dd9d3d5e,.github/workflows/ci.yml
          tree=$(git write-tree)
          test "$tree" = 458f0e3e692efb8da4f8c39959f62668fda5d57f
          export GIT_AUTHOR_NAME=darktunnelmika GIT_COMMITTER_NAME=darktunnelmika
          export GIT_AUTHOR_EMAIL=mikakhadmi@gmail.com GIT_COMMITTER_EMAIL=mikakhadmi@gmail.com
          export GIT_AUTHOR_DATE=2026-11-01T11:20:00Z GIT_COMMITTER_DATE=2026-11-01T11:20:00Z
          target=$(printf '%s\n' 'test: harden restore space checks and add disposable systemd acceptance source' | git -c commit.gpgsign=false commit-tree "$tree" -p 3279b15f4f842175a168bdc24be40da1c3f6f610)
          test "$target" = 16b9de83702e5561f8c3a664b06e031466027755
          git diff --exit-code 59e69e22119bd7e18e098a72e2799e12e893f37c "$target" -- .github/workflows
          git diff --check 59e69e22119bd7e18e098a72e2799e12e893f37c "$target"
          existing=$(git ls-remote --heads origin refs/heads/feat/native-panel-restore-v1 | cut -f1)
          if [ -n "$existing" ]; then
            test "$existing" = "$target"
            echo 'Exact reviewed branch already published; no mutation.'
          else
            git -c core.hooksPath=/dev/null push origin "$target:refs/heads/feat/native-panel-restore-v1"
          fi
          test "$(git ls-remote --heads origin refs/heads/feat/native-panel-restore-v1 | cut -f1)" = "$target"
          echo 'Code published only. No workflow update, merge, deployment or database operation.'

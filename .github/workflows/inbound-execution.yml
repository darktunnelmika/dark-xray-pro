name: DARK PRO Managed Inbound Execution

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**', 'feature/**', 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inbound-execution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Go 1.23 contracts, accounting and race checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify main application dependencies and static analysis
        run: |
          go mod verify
          go mod tidy -diff
          go vet ./...
      - name: Exercise the application and durable accounting under the race detector
        run: go test -race ./... -count=1 -timeout=600s

  native-runtime:
    name: Pinned native core, real traffic and isolated kernel TUN
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: XTLS/Xray-core
          ref: 701af60772cda123492f86e383e1fdba066614a9
          path: .inbound-core-v2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build the independently pinned native runtime and its source provenance
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/build-inbound-core.sh .inbound-core-v2 "$RUNNER_TEMP/inbound-artifact/native"
          echo "DXP_CORE_GO=$(command -v go)" >> "$GITHUB_ENV"
          echo "DXP_INBOUND_CORE_V2_BINARY=$RUNNER_TEMP/inbound-artifact/native/xray-inbound-v2" >> "$GITHUB_ENV"
          echo "DXP_INBOUND_CORE_V2_SHA256=$(cut -d' ' -f1 "$RUNNER_TEMP/inbound-artifact/native/xray-inbound-v2.sha256")" >> "$GITHUB_ENV"
          echo "DARK_PRO_TEST_INBOUND_CORE=$RUNNER_TEMP/inbound-artifact/native/xray-inbound-v2" >> "$GITHUB_ENV"
          tar --exclude=.git -czf "$RUNNER_TEMP/inbound-artifact/native/xray-inbound-v2-source.tar.gz" -C .inbound-core-v2 .
          mkdir -p "$RUNNER_TEMP/inbound-artifact/overlay/scripts/ci" "$RUNNER_TEMP/inbound-artifact/overlay/scripts/core-overlay" "$RUNNER_TEMP/inbound-artifact/overlay/internal/corebarrierv2"
          cp scripts/prepare-inbound-core.py "$RUNNER_TEMP/inbound-artifact/overlay/scripts/"
          cp scripts/ci/build-inbound-core.sh "$RUNNER_TEMP/inbound-artifact/overlay/scripts/ci/"
          cp scripts/core-overlay/inbound_stats.go.txt scripts/core-overlay/inbound_xdrive_test.go.txt scripts/core-overlay/inbound_tun_dns.go.txt scripts/core-overlay/inbound_tun_dns_test.go.txt scripts/core-overlay/inbound_vision_test.go.txt "$RUNNER_TEMP/inbound-artifact/overlay/scripts/core-overlay/"
          cp internal/corebarrierv2/barrier.go internal/corebarrierv2/barrier_test.go internal/corebarrierv2/README.md "$RUNNER_TEMP/inbound-artifact/overlay/internal/corebarrierv2/"
      - name: Build a separate race/checkptr instrumented test core
        working-directory: .inbound-core-v2
        run: go build -race -buildvcs=false -trimpath -o "$RUNNER_TEMP/xray-inbound-v2-race" ./main
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Prove all native protocol, transport, TLS and REALITY traffic paths
        shell: bash
        run: |
          set -euo pipefail
          go test -race ./internal/corebarrierv2 -run '^TestPinnedNativeInboundTrafficAndFinalReceipt$' -count=1 -json -timeout=300s > "$RUNNER_TEMP/native-matrix.jsonl" || { cat "$RUNNER_TEMP/native-matrix.jsonl"; exit 1; }
          python3 scripts/ci/assert-inbound-acceptance.py "$RUNNER_TEMP/native-matrix.jsonl" --matrix
      - name: Prove asynchronous core paths with the core's own race/checkptr instrumentation
        shell: bash
        run: |
          set -euo pipefail
          export DXP_INBOUND_CORE_V2_BINARY="$RUNNER_TEMP/xray-inbound-v2-race"
          export DXP_INBOUND_CORE_V2_SHA256=$(sha256sum "$DXP_INBOUND_CORE_V2_BINARY" | cut -d' ' -f1)
          go test -race ./internal/corebarrierv2 -run '^TestPinnedNativeInboundTrafficAndFinalReceipt/(shadowsocks|wireguard|hysteria|mixed|masque|transport_xdrive|vless_mux_xudp|reality_tcp|reality_tcp_vision_tls)$' -count=1 -json -timeout=300s > "$RUNNER_TEMP/native-race.jsonl" || { cat "$RUNNER_TEMP/native-race.jsonl"; exit 1; }
          python3 scripts/ci/assert-inbound-acceptance.py "$RUNNER_TEMP/native-race.jsonl" \
            --require TestPinnedNativeInboundTrafficAndFinalReceipt/shadowsocks \
            --require TestPinnedNativeInboundTrafficAndFinalReceipt/wireguard \
            --require TestPinnedNativeInboundTrafficAndFinalReceipt/hysteria \
            --require TestPinnedNativeInboundTrafficAndFinalReceipt/mixed \
            --require TestPinnedNativeInboundTrafficAndFinalReceipt/masque \
            --require TestPinnedNativeInboundTrafficAndFinalReceipt/transport_xdrive \
            --require TestPinnedNativeInboundTrafficAndFinalReceipt/vless_mux_xudp \
            --require TestPinnedNativeInboundTrafficAndFinalReceipt/reality_tcp \
            --require TestPinnedNativeInboundTrafficAndFinalReceipt/reality_tcp_vision_tls
      - name: Prove DNS TCP/UDP payload, asynchronous descendants and immutable final counters
        shell: bash
        run: |
          set -euo pipefail
          go test -race ./internal/corebarrierv2 -run '^TestPinnedNativeDNSQueriesAndFinalReceipt$' -count=1 -json -timeout=90s > "$RUNNER_TEMP/native-dns.jsonl" || { cat "$RUNNER_TEMP/native-dns.jsonl"; exit 1; }
          python3 scripts/ci/assert-inbound-acceptance.py "$RUNNER_TEMP/native-dns.jsonl" --require TestPinnedNativeDNSQueriesAndFinalReceipt
          export DXP_INBOUND_CORE_V2_BINARY="$RUNNER_TEMP/xray-inbound-v2-race"
          export DXP_INBOUND_CORE_V2_SHA256=$(sha256sum "$DXP_INBOUND_CORE_V2_BINARY" | cut -d' ' -f1)
          go test -race ./internal/corebarrierv2 -run '^TestPinnedNativeDNSQueriesAndFinalReceipt$' -count=1 -json -timeout=90s > "$RUNNER_TEMP/native-dns-race.jsonl" || { cat "$RUNNER_TEMP/native-dns-race.jsonl"; exit 1; }
          python3 scripts/ci/assert-inbound-acceptance.py "$RUNNER_TEMP/native-dns-race.jsonl" --require TestPinnedNativeDNSQueriesAndFinalReceipt
      - name: Prove owner API, SQLite, TLS Agent, zero receipt, accounting and stop
        shell: bash
        run: |
          set -euo pipefail
          go test -race ./internal/api -run '^TestManagedInboundRealOwnerToAgentAccountingSiblingsAndStop$' -count=1 -json -timeout=180s > "$RUNNER_TEMP/managed-owner-agent.jsonl" || { cat "$RUNNER_TEMP/managed-owner-agent.jsonl"; exit 1; }
          python3 scripts/ci/assert-inbound-acceptance.py "$RUNNER_TEMP/managed-owner-agent.jsonl" --require TestManagedInboundRealOwnerToAgentAccountingSiblingsAndStop
      - name: Prove private native Unix control denies another host UID
        shell: bash
        run: |
          set -euo pipefail
          go test -race -c -o "$RUNNER_TEMP/native-control.test" ./internal/inboundruntime
          sudo --non-interactive env DARK_PRO_TEST_INBOUND_CORE="$DARK_PRO_TEST_INBOUND_CORE" "$RUNNER_TEMP/native-control.test" -test.run='^TestNativePrivateUnixControlLifecycleAndCrossUID$' -test.v -test.timeout=90s | go tool test2json -p github.com/darktunnelmika/dark-xray-pro/internal/inboundruntime -t > "$RUNNER_TEMP/native-private-control.jsonl"
          python3 scripts/ci/assert-inbound-acceptance.py "$RUNNER_TEMP/native-private-control.jsonl" --require TestNativePrivateUnixControlLifecycleAndCrossUID
      - name: Prove actual privileged kernel TUN traffic in disposable namespaces
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/test-inbound-tun.sh "$DXP_INBOUND_CORE_V2_BINARY" "$DXP_INBOUND_CORE_V2_SHA256" | tee "$RUNNER_TEMP/kernel-tun.log"
          grep -q KERNEL_TUN_TCP_UDP_ACCOUNTING_FINAL_PASS "$RUNNER_TEMP/kernel-tun.log"
          ! grep -q -- '--- SKIP:' "$RUNNER_TEMP/kernel-tun.log"
      - name: Prove activation, final and crash DNS cleanup with private D-Bus and systemd-resolved
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/test-inbound-tun-dns.sh "$DXP_INBOUND_CORE_V2_BINARY" "$DXP_INBOUND_CORE_V2_SHA256" | tee "$RUNNER_TEMP/kernel-tun-dns.log"
          grep -q KERNEL_TUN_PRIVATE_RESOLVED_ACTIVATION_FINAL_CRASH_PASS "$RUNNER_TEMP/kernel-tun-dns.log"
          ! grep -q -- '--- SKIP:' "$RUNNER_TEMP/kernel-tun-dns.log"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the matching HUB, Agent and embedded owner UI from this commit
        shell: bash
        run: |
          set -euo pipefail
          DARK_PRO_PINNED_COMMIT="$GITHUB_SHA" bash scripts/build-lab-bundle.sh
          DARK_PRO_REQUIRE_EMBEDDED_UI=1 go test ./internal/webui -run '^TestReleaseContainsCompiledUI$' -count=1 -v
          cp -a release "$RUNNER_TEMP/inbound-artifact/application"
          python3 - "$RUNNER_TEMP/inbound-artifact" "$GITHUB_SHA" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          (root/'bundle-provenance.json').write_text(json.dumps({'application_commit':sys.argv[2], 'native_commit':'701af60772cda123492f86e383e1fdba066614a9', 'application_go':'1.23', 'native_go':'1.27.3', 'files':hashes},indent=2)+'\n')
          PY
      - name: Prove the compiled subscription UI against the running native worker and TLS Agent
        shell: bash
        run: |
          set -euo pipefail
          (cd web && npx playwright install --with-deps chromium)
          export DARK_PRO_TEST_MANAGED_BROWSER=1
          export DARK_PRO_TEST_WEB_DIST="$GITHUB_WORKSPACE/web/dist"
          export DARK_PRO_TEST_MANAGED_BROWSER_SCRIPT="$GITHUB_WORKSPACE/web/tests/live-inbound-subscription.mjs"
          go test -race ./internal/api -run '^TestManagedInboundRealBrowserSubscriptionLifecycle$' -count=1 -json -timeout=180s > "$RUNNER_TEMP/managed-browser.jsonl" || { cat "$RUNNER_TEMP/managed-browser.jsonl"; exit 1; }
          python3 scripts/ci/assert-inbound-acceptance.py "$RUNNER_TEMP/managed-browser.jsonl" --require TestManagedInboundRealBrowserSubscriptionLifecycle
      - name: Publish the tested matching LAB artifacts and corresponding native source
        uses: actions/upload-artifact@v4
        with:
          name: inbound-execution-native-linux-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/inbound-artifact
          if-no-files-found: error
          retention-days: 14
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inbound-execution-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-matrix.jsonl
            ${{ runner.temp }}/native-race.jsonl
            ${{ runner.temp }}/native-dns.jsonl
            ${{ runner.temp }}/native-dns-race.jsonl
            ${{ runner.temp }}/native-private-control.jsonl
            ${{ runner.temp }}/managed-owner-agent.jsonl
            ${{ runner.temp }}/managed-browser.jsonl
            ${{ runner.temp }}/kernel-tun.log
            ${{ runner.temp }}/kernel-tun-dns.log
          if-no-files-found: warn
          retention-days: 14

  standalone-engines:
    name: Standalone TUIC, AmneziaWG and MTProto engines
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MHSanaei/3x-ui
          ref: 608ef4e4010bf83e2e78328e08f77efc051ad4d7
          path: .sanaei-engines
      - uses: actions/checkout@v4
        with:
          repository: MHSanaei/mtg-multi
          ref: a45ebefed80e16949426381ef53fb5f1c1e4958d
          path: .mtproto-engine
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Prepare the independent engines from exact source revisions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/standalone-artifact/bin"
          python3 scripts/prepare-sanaei-engines.py .sanaei-engines "$RUNNER_TEMP/sanaei-workers"
          python3 scripts/prepare-mtproto-engine.py .mtproto-engine
      - name: Prove TUIC and AWG authentication, TCP/UDP, accounting and revocation
        working-directory: ${{ runner.temp }}/sanaei-workers
        shell: bash
        run: |
          set -euo pipefail
          go mod verify
          go test -race -buildvcs=false ./internal/darkproadapter ./cmd/darkpro-tuic ./cmd/darkpro-amneziawg -count=1 -json -timeout=240s > "$RUNNER_TEMP/standalone-traffic.jsonl" || { cat "$RUNNER_TEMP/standalone-traffic.jsonl"; exit 1; }
          python3 "$GITHUB_WORKSPACE/scripts/ci/assert-inbound-acceptance.py" "$RUNNER_TEMP/standalone-traffic.jsonl" \
            --require TestPrivateBridgeAuthenticationPayloadAndFinal \
            --require TestManagedTUICActualTCPUDPAccountingAndRevoke/bbr \
            --require TestManagedTUICActualTCPUDPAccountingAndRevoke/cubic \
            --require TestManagedTUICActualTCPUDPAccountingAndRevoke/new_reno \
            --require TestManagedAmneziaWG31ActualTCPUDPAccountingAndRevoke \
            --require TestMaterialRejectsNonRegularAndWritableSources \
            --require TestTUICRealECHAndSNIRejection \
            --require TestTUICCertificateSnapshotAndPrivateKeyLog \
            --require TestTUICRealOCSPStaplingAndInvalidResponse \
            --require TestTUICRealCertificateIssuanceAndChain
          (cd _darkpro/quic-go && go test -buildvcs=false -race ./internal/ackhandler -run '^TestDarkPro' -count=1 -v)
          # Keep all linked dependency sources and license notices with the
          # separately distributed GPL workers, then build from that tree.
          go mod vendor
          CGO_ENABLED=0 go build -mod=vendor -buildvcs=false -trimpath -o "$RUNNER_TEMP/standalone-artifact/bin/darkpro-tuic" ./cmd/darkpro-tuic
          CGO_ENABLED=0 go build -mod=vendor -buildvcs=false -trimpath -o "$RUNNER_TEMP/standalone-artifact/bin/darkpro-amneziawg" ./cmd/darkpro-amneziawg
      - name: Prove actual per-peer IPv6 sources, authority loss and final counters in disposable namespaces
        shell: bash
        run: |
          set -euo pipefail
          export DARK_PRO_AWG_IPV6_CLIENT_OUTPUT="$RUNNER_TEMP/standalone-artifact/acceptance/amneziawg-ipv6-client.test"
          bash scripts/ci/test-amneziawg-ipv6.sh "$RUNNER_TEMP/sanaei-workers" | tee "$RUNNER_TEMP/amneziawg-ipv6-namespace.log"
          grep -q MANAGED_AMNEZIAWG_IPV6_SOURCE_VERIFIED "$RUNNER_TEMP/amneziawg-ipv6-namespace.log"
          ! grep -q -- '--- SKIP:' "$RUNNER_TEMP/amneziawg-ipv6-namespace.log"
      - name: Prove real FakeTLS, named-user isolation, revocation, bridge and final MTProto receipts
        working-directory: .mtproto-engine
        shell: bash
        run: |
          set -euo pipefail
          go mod verify
          go test -race -buildvcs=false ./cmd/dark-pro-mtg ./mtglib -count=1 -json -timeout=180s > "$RUNNER_TEMP/mtproto-traffic.jsonl" || { cat "$RUNNER_TEMP/mtproto-traffic.jsonl"; exit 1; }
          python3 "$GITHUB_WORKSPACE/scripts/ci/assert-inbound-acceptance.py" "$RUNNER_TEMP/mtproto-traffic.jsonl" \
            --require TestManagedMTProtoFakeTLSPayloadAccountingIsolationAndFinal \
            --require TestManagedMTProtoRemovedCredentialCannotReturn \
            --require TestManagedMTProtoOwnerAggregatePayloadAndFinal \
            --require TestManagedMTProtoAuthenticatedSOCKSBridge \
            --require TestMTProtoBindingsRejectAliases \
            --require TestMTProtoControlNonceAndStrictRequests \
            --require TestMTProtoCheckAndPrivateProcessLifecycle
          go mod vendor
          CGO_ENABLED=0 go build -mod=vendor -buildvcs=false -trimpath -o "$RUNNER_TEMP/standalone-artifact/bin/dark-pro-mtg" ./cmd/dark-pro-mtg
      - name: Include all corresponding standalone sources, licenses and provenance
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf "$RUNNER_TEMP/standalone-artifact/sanaei-workers-source.tar.gz" -C "$RUNNER_TEMP/sanaei-workers" .
          tar --exclude=.git -czf "$RUNNER_TEMP/standalone-artifact/mtproto-worker-source.tar.gz" -C .mtproto-engine .
          cp "$RUNNER_TEMP/sanaei-workers/LICENSE" "$RUNNER_TEMP/standalone-artifact/Sanaei-LICENSE"
          cp .mtproto-engine/LICENSE "$RUNNER_TEMP/standalone-artifact/MTProto-LICENSE"
          cp "$RUNNER_TEMP/sanaei-workers/darkpro-sanaei-provenance.json" .mtproto-engine/darkpro-mtproto-provenance.json "$RUNNER_TEMP/standalone-artifact/"
          mkdir -p "$RUNNER_TEMP/standalone-artifact/build-scripts/scripts/ci"
          cp scripts/prepare-sanaei-engines.py scripts/prepare-mtproto-engine.py "$RUNNER_TEMP/standalone-artifact/build-scripts/scripts/"
          cp scripts/ci/test-amneziawg-ipv6.sh scripts/ci/assert-inbound-acceptance.py "$RUNNER_TEMP/standalone-artifact/build-scripts/scripts/ci/"
          cp -R scripts/engine-overlay "$RUNNER_TEMP/standalone-artifact/build-scripts/scripts/"
          python3 - "$RUNNER_TEMP/standalone-artifact" "$GITHUB_SHA" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          (root/'bundle-provenance.json').write_text(json.dumps({'application_commit':sys.argv[2], 'go':'1.27.3', 'files':hashes},indent=2)+'\n')
          PY
      - name: Publish separately linked standalone engines with corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: inbound-execution-standalone-linux-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/standalone-artifact
          if-no-files-found: error
          retention-days: 14
      - name: Preserve standalone traffic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inbound-execution-standalone-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/standalone-traffic.jsonl
            ${{ runner.temp }}/mtproto-traffic.jsonl
            ${{ runner.temp }}/amneziawg-ipv6-namespace.log
          if-no-files-found: warn
          retention-days: 14

  compiled-engine-integration:
    name: Authored profiles through real owner, Agent and pinned standalone workers
    needs: [native-runtime, standalone-engines]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: inbound-execution-native-linux-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/tested-native
      - uses: actions/download-artifact@v4
        with:
          name: inbound-execution-standalone-linux-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/tested-standalone
      - name: Verify matching application commit, source pins and every downloaded file hash
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/tested-native" "$RUNNER_TEMP/tested-standalone" "$GITHUB_SHA" <<'PY'
          import hashlib,json,pathlib,sys
          native,standalone=map(pathlib.Path,sys.argv[1:3])
          for root in (native,standalone):
              bundle=json.loads((root/'bundle-provenance.json').read_text())
              assert bundle['application_commit']==sys.argv[3], 'application artifact revision mismatch'
              assert bundle['files'], 'missing artifact hashes'
              for name,digest in bundle['files'].items():
                  relative=pathlib.Path(name)
                  assert not relative.is_absolute() and '..' not in relative.parts, 'unsafe manifest path'
                  assert hashlib.sha256((root/relative).read_bytes()).hexdigest()==digest, f'changed artifact: {name}'
          core=json.loads((native/'native/xray-inbound-v2.provenance.json').read_text())
          assert core['upstream_commit']=='701af60772cda123492f86e383e1fdba066614a9'
          assert core['binary_sha256']==hashlib.sha256((native/'native/xray-inbound-v2').read_bytes()).hexdigest()
          sanaei=json.loads((standalone/'darkpro-sanaei-provenance.json').read_text())
          assert sanaei['commit']=='608ef4e4010bf83e2e78328e08f77efc051ad4d7'
          mtg=json.loads((standalone/'darkpro-mtproto-provenance.json').read_text())
          assert mtg['commit']=='a45ebefed80e16949426381ef53fb5f1c1e4958d'
          print('Verified matching application revision, source pins and artifact checksums')
          PY
          # Artifact download intentionally normalizes permissions; restore
          # execute bits only after the bytes and pins have been verified.
          chmod 0755 "$RUNNER_TEMP/tested-native/native/xray-inbound-v2" "$RUNNER_TEMP/tested-standalone/bin/darkpro-tuic" "$RUNNER_TEMP/tested-standalone/bin/darkpro-amneziawg" "$RUNNER_TEMP/tested-standalone/bin/dark-pro-mtg"
          echo "DARK_PRO_TEST_INBOUND_CORE=$RUNNER_TEMP/tested-native/native/xray-inbound-v2" >> "$GITHUB_ENV"
          echo "DARK_PRO_TEST_ENGINE_TUIC=$RUNNER_TEMP/tested-standalone/bin/darkpro-tuic" >> "$GITHUB_ENV"
          echo "DARK_PRO_TEST_ENGINE_AMNEZIAWG=$RUNNER_TEMP/tested-standalone/bin/darkpro-amneziawg" >> "$GITHUB_ENV"
          echo "DARK_PRO_TEST_ENGINE_MTPROTO=$RUNNER_TEMP/tested-standalone/bin/dark-pro-mtg" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Prove actual compiler, TLS Agent, worker zero and activation, and complete group finalization
        shell: bash
        run: |
          set -euo pipefail
          go test -race ./internal/api -run '^TestManagedInboundRealExternalCompilerAgentLifecycle$' -count=1 -json -timeout=240s > "$RUNNER_TEMP/compiled-engine-integration.jsonl" || { cat "$RUNNER_TEMP/compiled-engine-integration.jsonl"; exit 1; }
          python3 scripts/ci/assert-inbound-acceptance.py "$RUNNER_TEMP/compiled-engine-integration.jsonl" \
            --require TestManagedInboundRealExternalCompilerAgentLifecycle \
            --require TestManagedInboundRealExternalCompilerAgentLifecycle/tuic \
            --require TestManagedInboundRealExternalCompilerAgentLifecycle/amneziawg \
            --require TestManagedInboundRealExternalCompilerAgentLifecycle/mtproto
      - name: Preserve compiled engine integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inbound-execution-compiled-integration-${{ github.sha }}
          path: ${{ runner.temp }}/compiled-engine-integration.jsonl
          if-no-files-found: warn
          retention-days: 14

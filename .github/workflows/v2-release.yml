name: v2 release

# Push a tag like v2.8.0 and this publishes dark-hub2 and dark-node for
# linux amd64 and arm64 with SHA256SUMS. The HUB's "update from release"
# button installs the newest one.

on:
  push:
    tags:
      - "v2.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -count=1 ./internal/v2/...
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" -o dist/dark-hub2-linux-$arch ./cmd/dark-hub2
            GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" -o dist/dark-node-linux-$arch ./cmd/dark-node
          done
          ./dist/dark-hub2-linux-amd64 version | grep -qx "dark-hub2 ${GITHUB_REF_NAME}"
          (cd dist && sha256sum dark-* > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Dark Xray Pro $GITHUB_REF_NAME" --generate-notes

name: Compact backup accounting checks
on:
  push:
    branches: ['fix/**']
    paths:
      - 'internal/business/backup_compact_*'
      - 'internal/business/inbound_execution_history_maintenance*'
      - 'internal/business/inbound_execution_history_noop*'
      - 'internal/business/inbound_execution_history_worker*'
      - 'internal/business/store.go'
      - 'internal/business/backup_assets.go'
      - 'internal/business/inbound_execution_runtime.go'
      - 'internal/business/sparse_usage_history*'
      - 'internal/hubstate/**'
      - 'internal/backupworker/**'
      - 'cmd/pro-backup/**'
      - '.github/workflows/compact-backup.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compact-backup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compact-backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify compact receipts, replay, freshness and source preservation
        run: go test -race -count=1 -timeout=120s ./internal/business -run '^(TestCompactOfflineReceiptsPreservesReplayAccountingAndFinal|TestIdleUsageStoresCompactProofWithoutChangingFreshnessOrReplay|TestCompactOfflineZeroDeltas|TestManagedInboundIdleAggregateAvoidsWrites|TestManagedInboundIdleReportsAvoidAccountWrites|TestManagedInboundIdleReportsKeepQuotaAndConflictChecks|TestExecutionHistoryMaintenancePreservesAccounting|TestExecutionHistoryMaintenanceBoundedCursor|TestExecutionHistoryWorkerOptInAndClose|TestExecutionHistoryWorkerProgressWithAccounting|TestExecutionHistoryWorkerCloseWhileWriterBusy|TestExecutionHistoryWorkerRejectsUnsafeWriterPool|TestExecutionHistoryMaintenanceNoEligibleRowsDoesNotWrite|TestSparseIntermediateZeroHistoryRestoresAndContinues)$'
      - name: Verify native backup, quarantine restore and snapshot contracts
        run: go test -race -count=1 -timeout=180s ./cmd/pro-backup ./internal/hubstate ./internal/probackup ./internal/backupworker
      - name: Build portable connected-host maintenance acceptance binary
        run: |
          CGO_ENABLED=0 go test -c -trimpath -o "$RUNNER_TEMP/history-worker.test" ./internal/business
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/history-worker-source.txt"
          (cd "$RUNNER_TEMP" && sha256sum history-worker.test history-worker-source.txt > history-worker-SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: history-worker-connected-host-acceptance
          path: |
            ${{ runner.temp }}/history-worker.test
            ${{ runner.temp }}/history-worker-source.txt
            ${{ runner.temp }}/history-worker-SHA256SUMS
          if-no-files-found: error

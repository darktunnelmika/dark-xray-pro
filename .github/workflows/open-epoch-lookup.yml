name: Open epoch authority lookup
on:
  push:
    branches: ["fix/open-epoch-lookup-20261110"]
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod download && go mod verify
      - name: Query plan and boundary equivalence
        run: go test -race ./internal/business -run '^TestExecutionStaleQuery' -count=3 -timeout=180s -json > query-tests.jsonl
      - name: Existing accounting and liveness contracts
        run: go test -race ./internal/business -run 'TestManagedInbound|TestInboundExecution|TestBusinessReadPool' -count=1 -timeout=600s -json > accounting-tests.jsonl
      - name: Static checks and HUB build
        run: |
          go vet ./internal/business
          go build ./cmd/hub
          gofmt -d internal/business/inbound_execution_liveness*.go > formatting.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open-epoch-lookup-evidence
          path: |
            query-tests.jsonl
            accounting-tests.jsonl
            formatting.patch
          if-no-files-found: error
          retention-days: 7

name: PRO Telegram stores

on:
  push:
    branches: ["feat/telegram-*", "feature/panel-integration-*"]
  pull_request:
    branches: [main, "feat/darkrestore-import-m2", "fix/managed-runtime-backup", "fix/node-retry-isolation", "feat/telegram-*", "feature/panel-integration-*"]
    paths:
      - "internal/telegrambot/**"
      - "internal/business/telegram*"
      - "internal/api/telegram*"
      - "cmd/hub/**"
      - "third_party/go-qrcode/**"
      - "go.mod"
      - "go.sum"
      - "scripts/ci/run_business_race.py"
      - "scripts/ci/test_run_business_race.py"
      - "scripts/telegram-lab-preflight.py"
      - "scripts/ci/test_telegram_lab_preflight.py"
      - "scripts/test-telegram-proxy.py"
      - "ops/nginx/telegram-stores.conf"
      - "ops/systemd/telegram-panel-write.conf"
      - "web/src/Telegram*"
      - "web/src/App.tsx"
      - "web/src/PageLoadBoundary.tsx"
      - "web/tests/telegram*"
      - "web/tests/shell.spec.ts"
      - ".github/workflows/telegram-bots.yml"

permissions:
  contents: read

jobs:
  telegram-proxy:
    name: Telegram panel proxy boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install disposable proxy runtime
        run: sudo apt-get update && sudo apt-get install -y nginx
      - name: Verify exact Telegram routes and credential request handling
        run: python3 scripts/test-telegram-proxy.py
  business-race:
    name: Telegram business race partition (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify exhaustive test partitioning
        run: python3 -m unittest discover -s scripts/ci -p test_run_business_race.py
      - name: Verify this complete business partition under the race detector
        run: python3 scripts/ci/run_business_race.py --shard ${{ matrix.shard }} --shards 2
  native-telegram:
    needs: [business-race]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require every business partition to succeed
        env:
          BUSINESS_RESULT: ${{ needs.business-race.result }}
        run: test "$BUSINESS_RESULT" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify read-only LAB preflight boundaries
        run: python3 -m unittest discover -s scripts/ci -p test_telegram_lab_preflight.py
      - name: Verify transport, API, delivery, isolation and offline backup
        run: go test -race ./internal/telegrambot ./internal/telegramhub ./internal/telegramreport ./internal/api ./internal/hubstate ./internal/probackup ./internal/backupworker ./cmd/hub ./cmd/pro-backup -count=1 -timeout=18m
      - name: Check packages
        run: go vet ./internal/telegrambot ./internal/business ./internal/api ./internal/hubstate ./cmd/hub
  telegram-panel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Verify Telegram roles, mobile Persian and lazy page navigation
        run: npx playwright test tests/telegram-stores.spec.ts tests/shell.spec.ts
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: telegram-panel-diagnostics
          path: web/test-results

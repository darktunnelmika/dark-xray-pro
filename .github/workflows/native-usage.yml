name: DARK PRO Native Metering Acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**']
permissions:
  contents: read
jobs:
  native-usage:
    name: Live browser + Registry TLS + native SQLite + pinned Xray
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original project dependencies
        run: |
          go mod verify
          go mod tidy -diff
      - name: Build compiled UI and its real browser
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build
          npx playwright install --with-deps chromium
      - name: Verify the same real Xray release as Foundation CI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-usage-core"
          cd "$RUNNER_TEMP/native-usage-core"
          curl -fLSs --retry 3 --connect-timeout 10 --max-time 120 \
            https://github.com/XTLS/Xray-core/releases/download/v26.9.9/Xray-linux-64.zip -o core.zip
          echo '1eb9175d0f0a8f8149c9230a7fc5ae66ce332ed20a53155ce61fe62e3f58b7df  core.zip' | sha256sum -c -
          unzip -j core.zip xray -d bin
          chmod 0700 bin/xray
          echo "DARK_PRO_TEST_XRAY_BINARY=$PWD/bin/xray" >> "$GITHUB_ENV"
          echo "DARK_PRO_TEST_XRAY_SHA256=$(sha256sum bin/xray | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Prove actual counters, quota filtering and same-UUID revocation
        run: go test ./internal/business -run '^TestRealPinnedUsageCountersSQLiteQuotaAndXrayRevocation$' -count=1 -v -timeout=60s
      - name: Prove continuous observation, outage fencing and preserved replay
        run: |
          set -euo pipefail
          go test ./internal/business -run '^TestRealPinnedContinuousUsageObserverTLSReplay$' -count=1 -json -timeout=90s > "$RUNNER_TEMP/continuous-observer.jsonl"
          python3 - "$RUNNER_TEMP/continuous-observer.jsonl" <<'PYTEST'
          import json,sys
          events=[json.loads(line) for line in open(sys.argv[1])]
          name='TestRealPinnedContinuousUsageObserverTLSReplay'
          assert any(e.get('Test')==name and e.get('Action')=='pass' for e in events)
          assert not any(e.get('Test')==name and e.get('Action') in ('skip','fail') for e in events)
          for e in events:
              if e.get('Output'): print(e['Output'],end='')
          PYTEST
      - name: Create customer in real UI and verify committed usage after real traffic
        env:
          DARK_PRO_TEST_LIVE_USAGE_BROWSER: '1'
          DARK_PRO_TEST_WEB_DIST: ${{ github.workspace }}/web/dist
          DARK_PRO_TEST_USAGE_BROWSER_SCRIPT: ${{ github.workspace }}/web/tests/live-usage.mjs
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/api -run '^TestRealBrowserNativeUsageXraySQLiteAndRevocation$' -count=1 -json -timeout=120s > "$RUNNER_TEMP/live-native-usage.jsonl"
          python3 - "$RUNNER_TEMP/live-native-usage.jsonl" <<'PY'
          import json,sys
          events=[json.loads(line) for line in open(sys.argv[1])]
          name='TestRealBrowserNativeUsageXraySQLiteAndRevocation'
          assert any(e.get('Test')==name and e.get('Action')=='pass' for e in events)
          assert not any(e.get('Test')==name and e.get('Action') in ('skip','fail') for e in events)
          for e in events:
              if e.get('Output'): print(e['Output'],end='')
          PY
      - name: Print diagnostic log on failure (no customer secrets)
        if: failure()
        run: |
          if test -f "$RUNNER_TEMP/live-native-usage.jsonl"; then cat "$RUNNER_TEMP/live-native-usage.jsonl"; fi
          if test -f "$RUNNER_TEMP/continuous-observer.jsonl"; then cat "$RUNNER_TEMP/continuous-observer.jsonl"; fi

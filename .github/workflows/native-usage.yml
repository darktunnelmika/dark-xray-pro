name: DARK PRO Native Metering Acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**']
permissions:
  contents: read
jobs:
  native-usage:
    name: Live browser + Registry TLS + native SQLite + pinned Xray
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original project dependencies
        run: |
          go mod verify
          go mod tidy -diff
      - name: Build compiled UI and its real browser
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build
          npx playwright install --with-deps chromium
      - name: Author TCP, gRPC and XHTTP with endpoint settings through the real UI and SQLite API
        env:
          DARK_PRO_TEST_CREATION_BROWSER: '1'
          DARK_PRO_TEST_WEB_DIST: ${{ github.workspace }}/web/dist
          DARK_PRO_TEST_CREATION_BROWSER_SCRIPT: ${{ github.workspace }}/web/tests/live-inbound-creation.mjs
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/api -run '^TestRealBrowserInboundCreationPlan$' -count=1 -json -timeout=150s > "$RUNNER_TEMP/live-inbound-creation.jsonl"
          python3 - "$RUNNER_TEMP/live-inbound-creation.jsonl" <<'PYCREATE'
          import json,sys
          events=[json.loads(line) for line in open(sys.argv[1])]
          name='TestRealBrowserInboundCreationPlan'
          assert sum(e.get('Test')==name and e.get('Action')=='pass' for e in events)==1
          assert not any(e.get('Test')==name and e.get('Action') in ('skip','fail') for e in events)
          for e in events:
              if e.get('Output'): print(e['Output'],end='')
          PYCREATE
      - name: Author TLS WebSocket and HTTPUpgrade, retain and replace credentials through the real UI
        env:
          DARK_PRO_TEST_CREATION_BROWSER: '1'
          DARK_PRO_TEST_WEB_DIST: ${{ github.workspace }}/web/dist
          DARK_PRO_TEST_TLS_BROWSER_SCRIPT: ${{ github.workspace }}/web/tests/live-inbound-tls.mjs
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/api -run '^TestRealBrowserInboundTLSCreationPlan$' -count=1 -json -timeout=150s > "$RUNNER_TEMP/live-inbound-tls.jsonl" || { cat "$RUNNER_TEMP/live-inbound-tls.jsonl"; exit 1; }
          python3 - "$RUNNER_TEMP/live-inbound-tls.jsonl" <<'PYTLS'
          import json,sys
          events=[json.loads(line) for line in open(sys.argv[1])]
          name='TestRealBrowserInboundTLSCreationPlan'
          assert sum(e.get('Test')==name and e.get('Action')=='pass' for e in events)==1
          assert not any(e.get('Action') in ('skip','fail') for e in events)
          assert sum('TLS_BROWSER_LIFECYCLE_PASS:' in e.get('Output','') for e in events)==1
          for e in events:
              if e.get('Output'): print(e['Output'],end='')
          PYTLS
      - name: Verify the same real Xray release as Foundation CI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-usage-core"
          cd "$RUNNER_TEMP/native-usage-core"
          curl -fLSs --retry 3 --connect-timeout 10 --max-time 120 \
            https://github.com/XTLS/Xray-core/releases/download/v26.9.9/Xray-linux-64.zip -o core.zip
          echo '1eb9175d0f0a8f8149c9230a7fc5ae66ce332ed20a53155ce61fe62e3f58b7df  core.zip' | sha256sum -c -
          unzip -j core.zip xray -d bin
          chmod 0700 bin/xray
          echo "DARK_PRO_TEST_XRAY_BINARY=$PWD/bin/xray" >> "$GITHUB_ENV"
          echo "DARK_PRO_TEST_XRAY_SHA256=$(sha256sum bin/xray | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Validate integrated Direct, Tunnel and Dark Swap configurations on the pinned core
        env:
          DARK_PRO_LAB_MODE: '1'
        run: |
          set -euo pipefail
          go test ./internal/xrayconfig -run '^TestRealPinnedCreationTopologyOffline$' -count=1 -json -timeout=60s > "$RUNNER_TEMP/inbound-topology.jsonl" || { cat "$RUNNER_TEMP/inbound-topology.jsonl"; exit 1; }
          python3 - "$RUNNER_TEMP/inbound-topology.jsonl" <<'PYTOPOLOGY'
          import json,sys
          events=[json.loads(line) for line in open(sys.argv[1])]
          assert any(e.get('Test')=='TestRealPinnedCreationTopologyOffline' and e.get('Action')=='pass' for e in events)
          required={'TestRealPinnedCreationTopologyOffline/tls-'+transport for transport in ('tcp','grpc','xhttp','ws','httpupgrade')}
          passed={e.get('Test') for e in events if e.get('Action')=='pass'}
          assert required<=passed, required-passed
          assert not any(e.get('Action') in ('skip','fail') for e in events)
          assert sum('INBOUND_OPTIONS_OFFLINE_PASS' in e.get('Output','') for e in events)==1
          for e in events:
              if e.get('Output'): print(e['Output'],end='')
          PYTOPOLOGY
      - name: Prove actual counters, quota filtering and same-UUID revocation
        run: go test ./internal/business -run '^TestRealPinnedUsageCountersSQLiteQuotaAndXrayRevocation$' -count=1 -v -timeout=60s
      - name: Prove continuous observation, outage fencing and preserved replay
        run: |
          set -euo pipefail
          go test ./internal/business -run '^TestRealPinnedContinuousUsageObserverTLSReplay$' -count=1 -json -timeout=90s > "$RUNNER_TEMP/continuous-observer.jsonl"
          python3 - "$RUNNER_TEMP/continuous-observer.jsonl" <<'PYTEST'
          import json,sys
          events=[json.loads(line) for line in open(sys.argv[1])]
          name='TestRealPinnedContinuousUsageObserverTLSReplay'
          assert any(e.get('Test')==name and e.get('Action')=='pass' for e in events)
          assert not any(e.get('Test')==name and e.get('Action') in ('skip','fail') for e in events)
          for e in events:
              if e.get('Output'): print(e['Output'],end='')
          PYTEST
      - name: Prove initial receipt gates the first customer listener
        shell: bash
        run: |
          set -euo pipefail
          go test -race ./internal/api -run '^TestRealPinnedPretrafficUsageAdmission$' -count=1 -json -timeout=180s > "$RUNNER_TEMP/pretraffic-admission.jsonl"
          python3 - "$RUNNER_TEMP/pretraffic-admission.jsonl" <<'PYGATE'
          import json,sys
          events=[json.loads(line) for line in open(sys.argv[1])]
          name='TestRealPinnedPretrafficUsageAdmission'
          required={name}|{name+'/'+s for s in ('receipt-before-first-byte','lost-zero-receipt','wrong-pin','lease-expires-at-barrier','restart-while-prepared','cancel-at-barrier')}
          passed={e.get('Test') for e in events if e.get('Action')=='pass'}
          assert required<=passed, required-passed
          assert not any(e.get('Action') in ('fail','skip') and e.get('Test','').startswith(name) for e in events)
          for e in events:
              if e.get('Output'): print(e['Output'],end='')
          PYGATE
      - name: Prove exact pretraffic settlement and fresh replacement on real Xray
        shell: bash
        run: |
          set -euo pipefail
          go test -race ./internal/api -run '^TestRealPinnedPretrafficSettlement$' -count=3 -json -timeout=180s > "$RUNNER_TEMP/pretraffic-settlement.jsonl"
          python3 - "$RUNNER_TEMP/pretraffic-settlement.jsonl" <<'PYSETTLE'
          import collections,json,sys
          events=[json.loads(line) for line in open(sys.argv[1])]
          name='TestRealPinnedPretrafficSettlement'
          required={name}|{name+'/'+s for s in ('settlement-restart','settlement-lost-final-receipt','settlement-lost-confirmation','settlement-unknown-tail','settlement-replacement')}
          passed=collections.Counter(e.get('Test') for e in events if e.get('Action')=='pass')
          assert all(passed[n]==3 for n in required), dict(passed)
          assert not any(e.get('Action') in ('skip','fail') and e.get('Test','').startswith(name) for e in events)
          for e in events:
              if e.get('Output'): print(e['Output'],end='')
          PYSETTLE
      - name: Prove remote Node metered admission on stock Xray and private TLS
        shell: bash
        run: |
          set -euo pipefail
          go test -race ./internal/api -run '^TestRealPinnedRemoteAgentMeteredAdmissionFromBirthToZeroReceipt$' -count=1 -json -timeout=120s > "$RUNNER_TEMP/remote-metered-admission.jsonl"
          python3 - "$RUNNER_TEMP/remote-metered-admission.jsonl" <<'PYREMOTE'
          import json,sys
          events=[json.loads(line) for line in open(sys.argv[1])]
          name='TestRealPinnedRemoteAgentMeteredAdmissionFromBirthToZeroReceipt'
          passed=[e for e in events if e.get('Test')==name and e.get('Action')=='pass']
          assert len(passed)==1, 'the remote metered admission case MUST pass'
          assert not any(e.get('Test')==name and e.get('Action') in ('fail','skip') for e in events)
          for e in events:
              if e.get('Output'): print(e['Output'],end='')
          PYREMOTE
      - name: Create customer in real UI and verify committed usage after real traffic
        env:
          DARK_PRO_TEST_LIVE_USAGE_BROWSER: '1'
          DARK_PRO_TEST_WEB_DIST: ${{ github.workspace }}/web/dist
          DARK_PRO_TEST_USAGE_BROWSER_SCRIPT: ${{ github.workspace }}/web/tests/live-usage.mjs
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/api -run '^TestRealBrowserNativeUsageXraySQLiteAndRevocation$' -count=1 -json -timeout=120s > "$RUNNER_TEMP/live-native-usage.jsonl"
          python3 - "$RUNNER_TEMP/live-native-usage.jsonl" <<'PY'
          import json,sys
          events=[json.loads(line) for line in open(sys.argv[1])]
          name='TestRealBrowserNativeUsageXraySQLiteAndRevocation'
          assert any(e.get('Test')==name and e.get('Action')=='pass' for e in events)
          assert not any(e.get('Test')==name and e.get('Action') in ('skip','fail') for e in events)
          for e in events:
              if e.get('Output'): print(e['Output'],end='')
          PY
      - name: Print diagnostic log on failure (no customer secrets)
        if: failure()
        run: |
          if test -f "$RUNNER_TEMP/live-native-usage.jsonl"; then cat "$RUNNER_TEMP/live-native-usage.jsonl"; fi
          if test -f "$RUNNER_TEMP/live-inbound-creation.jsonl"; then cat "$RUNNER_TEMP/live-inbound-creation.jsonl"; fi
          if test -f "$RUNNER_TEMP/continuous-observer.jsonl"; then cat "$RUNNER_TEMP/continuous-observer.jsonl"; fi
          if test -f "$RUNNER_TEMP/pretraffic-admission.jsonl"; then cat "$RUNNER_TEMP/pretraffic-admission.jsonl"; fi
          if test -f "$RUNNER_TEMP/pretraffic-settlement.jsonl"; then cat "$RUNNER_TEMP/pretraffic-settlement.jsonl"; fi

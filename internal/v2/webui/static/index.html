<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<script>try{document.querySelector('meta[name="color-scheme"]').content=localStorage.getItem("color-scheme")??"light dark";var l=localStorage.getItem("lang");if(l==="fa"){document.documentElement.lang="fa";document.documentElement.dir="rtl"}}catch(e){}</script>
<title>Dark VPN</title>
<link rel="stylesheet" href="app.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div id="app" aria-live="polite"></div>
<dialog id="modal" closedby="any" aria-labelledby="modal-title"></dialog>
<div id="toast" role="status" popover="manual"></div>
</body>
</html>

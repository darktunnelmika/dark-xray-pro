<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0c0f">
<title>&#8203;</title>
<style>
html, body { margin: 0; height: 100%; background: #0b0c0f; overflow: hidden; }
video { display: block; width: 100%; height: 100%; object-fit: cover; background: #dcdadd; }
@media (orientation: landscape) { video { object-fit: contain; background: #0b0c0f; } }
</style>
</head>
<body>
<video src="/cover.mp4" poster="/cover.jpg" autoplay muted loop playsinline preload="auto" aria-hidden="true"></video>
<script>
// Phones may hold autoplay back: start on the first touch.
(function () { var v = document.querySelector("video"); v.muted = true; var go = function () { v.play().catch(function () {}); };
  go(); addEventListener("pointerdown", go, { once: true }); })();
</script>
</body>
</html>
